# Public static frontend + loopback SSH tunnel to the local dataset gateway.
limit_req_zone $binary_remote_addr zone=nlp_search_requests:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=nlp_search_clients:1m;
limit_conn_zone $server_name zone=nlp_search_total:32k;

server {
    listen 80;
    server_name search.shwstone.cn;
    access_log /var/log/nginx/search.shwstone.cn.access.log;
    error_log /var/log/nginx/search.shwstone.cn.error.log warn;
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-search;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://search.shwstone.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name search.shwstone.cn;
    ssl_certificate /etc/letsencrypt/live/search.shwstone.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/search.shwstone.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/nlp-search-engine/current/web;
    access_log /var/log/nginx/search.shwstone.cn.access.log;
    error_log /var/log/nginx/search.shwstone.cn.error.log warn;
    server_tokens off;
    autoindex off;
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 10s;
    keepalive_requests 100;
    send_timeout 45s;

    limit_conn nlp_search_clients 8;
    limit_conn nlp_search_total 16;
    limit_conn_status 429;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;
    proxy_request_buffering on;
    proxy_buffering on;

    location = / {
        limit_except GET { deny all; }
        try_files /index.html =404;
    }
    location /static/ {
        limit_except GET { deny all; }
        alias /opt/nlp-search-engine/current/web/;
        expires 5m;
    }
    location = /datasets {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18081;
    }
    location /datasets/ {
        limit_except GET POST { deny all; }
        limit_conn nlp_search_clients 4;
        limit_conn nlp_search_total 8;
        limit_req zone=nlp_search_requests burst=10 nodelay;
        proxy_pass http://127.0.0.1:18081;
    }
    location = /gateway/health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18081;
    }
    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18081;
    }
    location = /index/info {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18081;
    }
    location = /search {
        limit_except POST { deny all; }
        limit_conn nlp_search_clients 4;
        limit_conn nlp_search_total 8;
        limit_req zone=nlp_search_requests burst=10 nodelay;
        proxy_pass http://127.0.0.1:18081;
    }
    location / {
        return 404;
    }
}
